name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ruff format check
        run: uv run ruff format --check

      - name: Run mypy check
        run: uv run mypy django_nplus1/

      - name: Run ty check
        run: uv run ty check django_nplus1/

  test:
    runs-on: ubuntu-latest
    env:
      # Overrides .python-version for every uv command in the job.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"
        django-version:
          - "6.0"
          - "6.1"

        include:
          # Pre-release Django
          - python-version: "3.14"
            django-version: "main"
          # Pre-release Python
          - python-version: "3.15"
            django-version: "6.1"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --no-dev --group test

      - name: Install Django ${{ matrix.django-version }}
        run: |
          if [ "${{ matrix.django-version }}" = "main" ]; then
            uv pip install "Django @ git+https://github.com/django/django.git@main"
          else
            uv pip install "Django~=${{ matrix.django-version }}.0"
          fi

      # --no-sync keeps the Django version installed above.
      - name: Run tests
        run: uv run --no-sync coverage run -m pytest

      - name: Write coverage report
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1'
        run: uv run --no-sync coverage xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
